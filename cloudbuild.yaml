# Build and publish by default. Set _DEPLOY=true in the release trigger.
# The deploy step changes only the image. API_URL, SANDBOX_API_URL and the
# other runtime values stay in vlabsio/infra
# helmfile/values-mainnet/frontends/dual-wallet.yaml.
steps:
  - id: build
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --platform=linux/amd64
      - --build-arg=NEXT_PUBLIC_APP_URL=${_APP_URL}
      - --build-arg=NEXT_PUBLIC_EXTERNAL_FACE_BRIDGE_ORIGINS=${_EXTERNAL_FACE_BRIDGE_ORIGINS}
      - --build-arg=NEXT_PUBLIC_EXTERNAL_FACE_BRIDGE_APPLICATIONS=${_EXTERNAL_FACE_BRIDGE_APPLICATIONS}
      - -t
      - ${_REGISTRY}/$PROJECT_ID/smt/dual-wallet:$BUILD_ID
      - .
  - id: push
    name: gcr.io/cloud-builders/docker
    args: [push, '${_REGISTRY}/$PROJECT_ID/smt/dual-wallet:$BUILD_ID']
  - id: deploy
    name: gcr.io/cloud-builders/kubectl
    entrypoint: bash
    args:
      - -ceu
      - |
        case "$${DEPLOY}" in
          false) echo 'Image published; deployment is disabled.'; exit 0 ;;
          true) ;;
          *) echo '_DEPLOY must be true or false' >&2; exit 1 ;;
        esac
        digest=$$(gcloud artifacts docker images describe "$${IMAGE}" --project "$PROJECT_ID" \
          --format='value(image_summary.digest)')
        [[ "$$digest" =~ ^sha256:[a-f0-9]{64}$ ]] || { echo 'Invalid image digest' >&2; exit 1; }
        # The GKE Deployment frontends/dual-wallet (vlabsio/infra
        # helmfile/charts/frontend) serves wallet.dual.network.
        gcloud container clusters get-credentials dual-mainnet-prod-eu --project "$PROJECT_ID" \
          --region "$${REGION}" --dns-endpoint
        kubectl --namespace frontends set image deployment/dual-wallet \
          dual-wallet="$${IMAGE%:*}@$$digest"
        kubectl --namespace frontends rollout status deployment/dual-wallet --timeout=300s
    env:
      - DEPLOY=${_DEPLOY}
      - REGION=${_REGION}
      - IMAGE=${_REGISTRY}/$PROJECT_ID/smt/dual-wallet:$BUILD_ID
      - KUBECONFIG=/workspace/.kube/config
substitutions:
  _REGISTRY: europe-west6-docker.pkg.dev
  _REGION: europe-west6
  _DEPLOY: 'false'
  _APP_URL: https://wallet.dual.network
  _EXTERNAL_FACE_BRIDGE_ORIGINS: https://faces.dual.network
  _EXTERNAL_FACE_BRIDGE_APPLICATIONS: dual.dpp@1=https://faces.dual.network/dpp/v1/
images:
  - ${_REGISTRY}/$PROJECT_ID/smt/dual-wallet:$BUILD_ID
options:
  logging: CLOUD_LOGGING_ONLY
timeout: 1800s
